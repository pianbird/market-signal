name: Market analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0-4" # KST Monday-Friday 08:30 (UTC Sunday-Thursday 23:30)

concurrency:
  group: market-analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      OUTPUT_DIR: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run market analysis
        env:
          MY_BOT_TOKEN: ${{ secrets.MY_BOT_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python market_integrated_analysis_v2.5.py
      - name: Upload Excel report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: market-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/*.xlsx
          if-no-files-found: error
          retention-days: 30
